# /etc/nginx/sites-available/zu-training.conf
# بوابة الويب تخدم الملفات الثابتة وتُمرّر /api إلى خدمة الـAPI على المنفذ الداخلي.
server {
    listen 80;
    server_name training.zu.edu.jo;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name training.zu.edu.jo;

    ssl_certificate     /etc/ssl/certs/zu-training.crt;
    ssl_certificate_key /etc/ssl/private/zu-training.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 45m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
