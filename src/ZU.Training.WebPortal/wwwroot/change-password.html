<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>تعيين كلمة مرور جديدة | جامعة الزرقاء</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link id="bootstrap-style" rel="stylesheet" href="/vendor/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="change-password">
  <header id="app-header" class="site-header"></header>

  <main class="container" style="max-width:560px;padding-block:48px">
    <div class="panel">
      <div class="panel-heading">
        <div>
          <h2 data-i18n="changeTitle">تعيين كلمة مرور جديدة</h2>
          <p data-i18n="changeHelp">غيّر كلمة المرور الأولية قبل استخدام المنصة.</p>
        </div>
      </div>
      <div id="password-message" class="alert d-none" role="alert"></div>
      <div id="policy-note" class="small-muted mb-3"></div>
      <form id="change-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="old-password" data-i18n="oldPassword">كلمة المرور الأولية</label>
          <input id="old-password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-password" data-i18n="newPassword">كلمة المرور الجديدة</label>
          <input id="new-password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirm-password" data-i18n="confirmPassword">تأكيد كلمة المرور</label>
          <input id="confirm-password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 action-button" data-i18n="savePassword">حفظ والمتابعة</button>
      </form>
    </div>
  </main>

  <script src="/vendor/jquery.min.js"></script>
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
