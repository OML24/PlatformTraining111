name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء واختبار
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: استعادة الحزم
        run: dotnet restore ZU.Training.sln

      - name: البناء
        run: dotnet build ZU.Training.sln -c Release --no-restore

      - name: الاختبارات
        run: dotnet test ZU.Training.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: أدوات .NET المحلية
        run: dotnet tool restore || true

  scripts:
    name: فحص الواجهة والسكربتات
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: فحص صحة ملفات JavaScript
        run: |
          set -e
          for file in src/ZU.Training.WebPortal/wwwroot/js/*.js; do
            node --check "$file"
          done

      - name: فحص ترجمة الواجهة
        run: |
          node -e '
          const fs = require("fs");
          global.window = {};
          eval(fs.readFileSync("src/ZU.Training.WebPortal/wwwroot/js/i18n.js", "utf8"));
          const ar = Object.keys(window.ZU_LABELS.ar), en = Object.keys(window.ZU_LABELS.en);
          const missingEn = ar.filter(k => !en.includes(k));
          const missingAr = en.filter(k => !ar.includes(k));
          if (missingEn.length || missingAr.length) {
            console.error("مفاتيح ناقصة:", missingEn, missingAr);
            process.exit(1);
          }
          console.log("مفاتيح الترجمة متطابقة:", ar.length);
          '

      - name: مطابقة مسارات الواجهة مع الـAPI
        run: python3 scripts/route-audit.py

      - name: فحص تماسك الطبقات
        run: python3 scripts/static-audit.py

  smoke:
    name: تشغيل حقيقي وفحص HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zu_training
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: zu_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TrainingDb: Host=127.0.0.1;Port=5432;Database=zu_smoke;Username=zu_training;Password=smoke-password
      Security__EncryptionKey: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      Security__JwtSigningKey: smoke-test-signing-key-0123456789abcdef0123456789abcdef
      Api__BaseUrl: http://127.0.0.1:5189
      Portal__BaseUrl: http://127.0.0.1:5249
      Certificate__VerificationBaseUrl: http://127.0.0.1:5249/verify.html
      Storage__OfficialDocumentsPath: /tmp/smoke/storage/official
      Storage__CertificateTemplatesPath: /tmp/smoke/storage/templates
      Storage__CertificatesPath: /tmp/smoke/storage/certificates
      Storage__CourseFilesPath: /tmp/smoke/storage/course-files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: بناء
        run: dotnet build ZU.Training.sln -c Release

      - name: تطبيق الترحيلات
        run: |
          set -o pipefail
          dotnet run --project src/ZU.Training.WebApi -c Release --no-build -- --migrate 2>&1 | tee /tmp/migrate.log

      - name: إنشاء حساب الأدمن
        run: |
          set -e
          dotnet run --project src/ZU.Training.WebApi -c Release --no-build -- \
            --bootstrap-admin --login 1001 --name "مدير الاختبار" --email admin@example.edu \
            | tee /tmp/bootstrap.txt
          grep "Initial password" /tmp/bootstrap.txt | sed 's/.*: //' > /tmp/admin-password.txt

      - name: تشغيل الـAPI والبوابة
        run: |
          set -e
          mkdir -p /tmp/smoke/storage
          nohup dotnet run --project src/ZU.Training.WebApi -c Release --no-build -- \
            --urls http://127.0.0.1:5189 > /tmp/api.log 2>&1 &
          nohup dotnet run --project src/ZU.Training.WebPortal -c Release --no-build -- \
            --urls http://127.0.0.1:5249 > /tmp/portal.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5189/api/health >/dev/null 2>&1 && break
            sleep 2
          done

      - name: فحص HTTP
        run: |
          ADMIN_PASSWORD="$(cat /tmp/admin-password.txt)" bash scripts/smoke.sh

      - name: سجلات الخدمات عند الفشل
        if: failure()
        run: |
          if [ -f /tmp/migrate.log ]; then
            echo "::error title=migrate::$(grep -m1 -E 'Unhandled exception' /tmp/migrate.log | sed 's/%/%25/g' || echo 'no exception line')"
            grep -E 'Npgsql|PostgresException|FATAL|Failed executing|error:|MessageText' /tmp/migrate.log \
              | head -8 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=migrate::${line}"; done
            grep -m3 -A6 'Unhandled exception' /tmp/migrate.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=migrate-detail::${line}"; done
          fi
          for f in /tmp/api.log /tmp/portal.log; do
            [ -f "$f" ] || continue
            grep -m4 -E 'Unhandled exception|Failed|error' "$f" | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=${f##*/}::${line}"; done
          done

      - name: نشر سجل الفشل على الفرع
        if: failure()
        run: |
          mkdir -p .ci
          { echo '### report'; cat /tmp/smoke/report.txt 2>/dev/null; echo '### api'; tail -40 /tmp/api.log 2>/dev/null; echo '### portal'; tail -20 /tmp/portal.log 2>/dev/null; } > .ci/last-failure.log
          git config user.name "ci-diagnostics"
          git config user.email "ci@users.noreply.github.com"
          git add .ci/last-failure.log
          git commit -m "ci: failure log [skip ci]" || true
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME} || true

      - name: حفظ السجلات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/api.log
            /tmp/portal.log
            /tmp/smoke/last.json
          if-no-files-found: ignore

  docker:
    name: بناء صورة Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: بناء الصورة
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zu-training-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
