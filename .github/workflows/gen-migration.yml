name: Generate Migration

# يولّد هجرة EF فعلية (مع تحديث ModelSnapshot) عند الحاجة، دون الحاجة إلى SDK على جهاز المطوّر.
# التشغيل: عدّل ملف .github/gen-migration ثم ادفعه (أو workflow_dispatch من الفرع الافتراضي).
on:
  push:
    paths:
      - ".github/gen-migration"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ConnectionStrings__TrainingDb: Host=127.0.0.1;Port=5432;Database=design;Username=design;Password=design
      Security__EncryptionKey: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      Security__JwtSigningKey: design-time-signing-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: استعادة الأدوات والحزم
        run: |
          dotnet tool restore
          dotnet restore ZU.Training.sln

      - name: توليد الهجرة
        run: |
          dotnet ef migrations add PlatformSync \
            --project src/ZU.Training.Infrastructure \
            --startup-project src/ZU.Training.WebApi \
            --context TrainingDbContext

      - name: عرض الملفات المولدة
        run: git status --short src/ZU.Training.Infrastructure/Data/Migrations

      - name: دفع الهجرة المولدة إلى الفرع
        run: |
          if git diff --quiet -- src/ZU.Training.Infrastructure/Data/Migrations; then
            echo "لا تغييرات في النموذج"
            exit 0
          fi
          git config user.name "migration-bot"
          git config user.email "migration-bot@users.noreply.github.com"
          git add src/ZU.Training.Infrastructure/Data/Migrations
          git commit -m "chore(migrations): regenerate EF model snapshot"
          git push
